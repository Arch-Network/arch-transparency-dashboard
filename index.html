<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/arch-prime-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Arch Prime transparency dashboard: value locked, swap volume and fees, Arch Lend markets and risk parameters, Arch Perps, Theya Bitcoin holdings, chain activity, and ArchUSD supply, from live data."
    />
    <title>Arch Prime — Transparency</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Inter+Tight:wght@400;500;600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- Light is the default for executive data readability; explicit dark preference persists via localStorage. -->
    <script>
      try {
        var t = localStorage.getItem('arch-prime-theme')
        if (t === 'dark' || t === 'light') {
          document.documentElement.setAttribute('data-theme', t)
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
